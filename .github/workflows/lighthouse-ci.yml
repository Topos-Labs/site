name: Lighthouse CI

on:
  # Run daily at midnight UTC
  schedule:
    - cron: '0 0 * * *'

  # Allow manual trigger
  workflow_dispatch:

  # Run on push to main (optional, comment out if too frequent)
  push:
    branches:
      - main
    paths:
      - '**.html'
      - '**.css'
      - '**.js'
      - 'assets/**'

jobs:
  lighthouse:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Wait for deployment
        if: github.event_name == 'push'
        run: sleep 60

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v11
        with:
          urls: |
            https://toposlabs.ai/
          uploadArtifacts: true
          temporaryPublicStorage: true

      - name: Check Lighthouse scores
        uses: treosh/lighthouse-ci-action@v11
        with:
          urls: |
            https://toposlabs.ai/
          uploadArtifacts: false
          runs: 3
          # Fail if scores are below threshold
          budgetPath: .github/lighthouse/budget.json

      - name: Format results
        if: always()
        run: |
          echo "## Lighthouse CI Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "View detailed results in the artifacts section above." >> $GITHUB_STEP_SUMMARY

      - name: Comment on PR (if applicable)
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '## ⚡ Lighthouse CI Results\n\nLighthouse audit completed. Check the workflow artifacts for detailed results.'
            })
