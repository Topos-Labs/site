<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sitemap - Topos Labs</title>
    <meta name="description" content="Sitemap for the Topos Labs website.">
    <link rel="canonical" href="https://toposlabs.ai/sitemap.html">
    <style>
        @font-face {
            font-family: 'Nunito';
            font-style: normal;
            font-weight: 400;
            font-display: swap;
            src: url('/assets/fonts/nunito-400.woff2') format('woff2');
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg: #0a0a0a;
            --border: rgba(255,255,255,0.1);
            --text: #ffffff;
            --text-secondary: #c0c0c0;
            --text-tertiary: #808080;
        }
        body {
            font-family: 'Nunito', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
        }
        .container { max-width: 960px; margin: 0 auto; padding: 120px 24px 80px; }
        h1 { font-size: 36px; font-weight: 600; margin-bottom: 16px; }
        p { color: var(--text-secondary); margin-bottom: 40px; }
        ul { list-style: none; margin-bottom: 24px; }
        li { margin-bottom: 12px; }
        a { color: var(--text-secondary); text-decoration: none; transition: color 0.2s; }
        a:hover { color: var(--text); }
        .url { font-size: 13px; color: var(--text-tertiary); margin-left: 8px; }
        nav {
            position: fixed; top: 0; left: 0; right: 0; z-index: 100;
            background: rgba(10,10,10,0.8); backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
        }
        .nav-content {
            max-width: 960px; margin: 0 auto; padding: 0 24px;
            display: flex; justify-content: space-between; align-items: center; height: 64px;
        }
        .logo { display: flex; align-items: center; gap: 10px; font-size: 15px; font-weight: 600; color: var(--text); }
        .logo-labs { color: #3DBAAC; }
        .logo-icon { width: 28px; height: 36px; }
        .nav-links { display: flex; gap: 32px; list-style: none; }
        .nav-links a { font-size: 14px; }
        footer { padding: 48px 24px; border-top: 1px solid var(--border); color: var(--text-tertiary); text-align: center; }
        @media (max-width: 640px) {
            h1 { font-size: 28px; }
            .nav-links { display: none; }
        }
    </style>
</head>
<body>
    <nav>
        <div class="nav-content">
            <a href="/" class="logo">
                <img src="/assets/logo-icon.svg" alt="Topos Labs" class="logo-icon" width="28" height="36">
                <span>Topos <span class="logo-labs">Labs</span></span>
            </a>
            <ul class="nav-links">
                <li><a href="/">Home</a></li>
                <li><a href="https://github.com/Topos-Labs" target="_blank" rel="noopener">GitHub</a></li>
            </ul>
        </div>
    </nav>

    <main class="container">
        <h1>Sitemap</h1>
        <p>Complete navigation for public pages on toposlabs.ai.</p>
        <ul>
            <li><a href="/">Home</a> <span class="url">https://toposlabs.ai/</span></li>
            <li><a href="/sitemap.xml">XML Sitemap</a> <span class="url">For search engines</span></li>
            <li><a href="/robots.txt">Robots.txt</a> <span class="url">Crawler directives</span></li>
        </ul>
    </main>

    <footer>© 2026 Topos Labs</footer>
</body>
</html>
