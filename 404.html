<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, follow">
    <title>Page Not Found - Topos Labs</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 32px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #0a0a0a;
            color: #ffffff;
            line-height: 1.5;
            text-align: center;
        }
        main { max-width: 520px; }
        h1 { font-size: clamp(32px, 6vw, 52px); font-weight: 700; margin-bottom: 16px; }
        p { color: #c0c0c0; margin-bottom: 28px; }
        a {
            display: inline-flex;
            align-items: center;
            min-height: 44px;
            padding: 0 18px;
            border: 1px solid rgba(255,255,255,0.18);
            border-radius: 8px;
            color: #ffffff;
            text-decoration: none;
            background: rgba(255,255,255,0.06);
        }
        a:hover { background: rgba(255,255,255,0.1); }
    </style>
</head>
<body>
    <main>
        <h1>Page not found</h1>
        <p>The page you requested is no longer available.</p>
        <a href="/">Go home</a>
    </main>
</body>
</html>
